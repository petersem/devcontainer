name: Jest Tests

on:
  push:
    branches:
      - 'main'

jobs:
  test-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        
      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run Jest tests
        id: jest
        run: |
          set +e
          npm test -- --json --outputFile=jest-results.json
          echo "exit_code=$?" >> $GITHUB_OUTPUT
          set -e

      - name: Parse Jest results for Discord
        id: parsed
        run: |
          # Summary counts
          SUMMARY=$(jq -r '
            .testResults
            | group_by(.status)
            | map({status: .[0].status, count: length})
            | map("\(.status): \(.count)")
            | join("\n")
          ' jest-results.json)

          # Detailed per-test output
          DETAILS=$(jq -r '
            .testResults[]
            | "\(.name): \(.status)"
          ' jest-results.json)

          # Escape quotes for JSON
          SUMMARY_ESCAPED=$(printf "%s" "$SUMMARY" | sed 's/"/\\"/g')
          DETAILS_ESCAPED=$(printf "%s" "$DETAILS" | sed 's/"/\\"/g')

          {
            echo "summary<<EOF"
            echo "$SUMMARY_ESCAPED"
            echo "EOF"
            echo "details<<EOF"
            echo "$DETAILS_ESCAPED"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Send discord notification
        if: always()
        run: |
          STATUS="✅ UnitTests passed"
          if [ "${{ steps.jest.outputs.exit_code }}" != "0" ]; then
            STATUS="❌ UnitTests failed"
          fi

          MESSAGE="${STATUS} on branch **${GITHUB_REF_NAME}**.

**Summary:**
\`\`\`
${{ steps.parsed.outputs.summary }}
\`\`\`

**Details:**
\`\`\`
${{ steps.parsed.outputs.details }}
\`\`\`
"

          curl -H "Content-Type: application/json" \
            -X POST \
            -d "{\"content\": \"$MESSAGE\"}" \
            ${{ secrets.WEBHOOK_URL }}
