name: Jest Test Details

on:
  push:
    branches:
      - 'main'

jobs:
  test-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests
        id: jest
        run: |
          set +e
          npm test -- --json --outputFile=jest-results.json
          EXIT_CODE=$?
          echo "EXIT_CODE=$EXIT_CODE" >> jest-exit-code.env
          set -e

      - name: Send discord notification
        if: always()
        env:
          BRANCH: ${{ github.ref_name }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          # Load exit code (still useful for debugging)
          source jest-exit-code.env

          # Build summary
          SUMMARY=$(jq -r '
            .testResults
            | group_by(.status)
            | map("\(.[0].status): \(length)")
            | join("\n")
          ' jest-results.json)

          # Build details
          DETAILS=$(jq -r '
            .testResults[]
            | "\(.name): \(.status)"
          ' jest-results.json)

          # Determine pass/fail based on actual test results
          FAILED_COUNT=$(jq '[.testResults[] | select(.status != "passed")] | length' jest-results.json)

          if [ "$FAILED_COUNT" -eq 0 ]; then
            STATUS="✅ UnitTests passed"
          else
            STATUS="❌ UnitTests failed"
          fi

          # Build message safely in a file
          {
            echo "$STATUS on branch **$BRANCH**."
            echo
            echo "**Summary**"
            echo '```'
            echo "$SUMMARY"
            echo '```'
            echo
            echo "**Details