name: Jest Test Details

on:
  push:
    branches:
      - 'main'

jobs:
  test-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        
      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run Jest tests
        id: jest
        run: |
          set +e
          npm test -- --json --outputFile=jest-results.json
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          set -e

      - name: Parse Jest results for Discord
        id: parsed
        run: |
          # Summary counts
          SUMMARY=$(jq -r '
            .testResults
            | group_by(.status)
            | map({status: .[0].status, count: length})
            | map("\(.status): \(.count)")
            | join("\n")
          ' jest-results.json)

          # Detailed per-test output
          DETAILS=$(jq -r '
            .testResults[]
            | "\(.name): \(.status)"
          ' jest-results.json)

          # Escape quotes for JSON
          SUMMARY_ESCAPED=$(printf "%s" "$SUMMARY" | sed 's/"/\\"/g')
          DETAILS_ESCAPED=$(printf "%s" "$DETAILS" | sed 's/"/\\"/g')

          {
            echo "summary<<EOF"
            echo "$SUMMARY_ESCAPED"
            echo "EOF"
            echo "details<<EOF"
            echo "$DETAILS_ESCAPED"
            echo "EOF"
