name: Jest Test Details

on:
  push:
    branches:
      - 'main'

jobs:
  test-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up node
        uses: actions/setup-node@v6
        with:
          node-version: 'latest'

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests
        id: jest
        run: |
          set +e
          npm test -- --json --outputFile=jest-results.json
          EXIT_CODE=$?
          echo "EXIT_CODE=$EXIT_CODE" >> jest-exit-code.env
          set -e

      - name: Send discord notification
        if: always()
        env:
          EXIT_CODE: ${{ steps.jest.outputs.exit_code }}
          BRANCH: ${{ github.ref_name }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          # Build summary
          SUMMARY=$(jq -r '
            .testResults
            | group_by(.status)
            | map("\(.[0].status): \(length)")
            | join("\n")
          ' jest-results.json)

          # Build details
          DETAILS=$(jq -r '
            .testResults[]
            | "\(.name): \(.status)"
          ' jest-results.json)

          # Decide status
          if [ "$EXIT_CODE" = "0" ]; then
            STATUS="✅ UnitTests passed"
          else
            STATUS="❌ UnitTests failed"
          fi

          # Write message to a file (avoids YAML parsing issues)
          {
            echo "$STATUS on branch **$BRANCH**."
            echo
            echo "**Summary**"
            echo '```'
            echo "$SUMMARY"
            echo '```'
            echo
            echo "**Details**"
            echo '```'
            echo "$DETAILS"
            echo '```'
          } > message.txt

          # Send to Discord using jq to build JSON
          jq -n --rawfile content message.txt '{content: $content}' \
            | curl -H "Content-Type: application/json" \
                  -X POST \
                  -d @- \
                  "$WEBHOOK_URL"
