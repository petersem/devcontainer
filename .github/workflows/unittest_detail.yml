name: Jest Test Details

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  test-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up node
        uses: actions/setup-node@v6
        with:
          node-version: 'latest'

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests
        id: jest
        run: |
          set +e
          npm test -- --json --outputFile=jest-results.json --coverage --coverageReporters=json-summary
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          set -e

      - name: Send discord notification
        if: always()
        env:
          EXIT_CODE: ${{ steps.jest.outputs.exit_code }}
          BRANCH: ${{ github.ref_name }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          # project name
          PROJECT_NAME=$(jq -r '.name' package.json)

          # Build summary
          SUMMARY=$(jq -r '
            .testResults
            | group_by(.status)
            | map("\(.[0].status): \(length)")
            | join("\n")
          ' jest-results.json)

          # Build details
          DETAILS=$(jq -r '
            .testResults[]
            | .assertionResults[]
            | "\(.status | ascii_upcase) - \(.fullName)"
          ' jest-results.json)

          # Build coverage
          COVERAGE=$(jq -r '
            .total
            | "Statements: \(.statements.pct)%\nBranches: \(.branches.pct)%\nFunctions: \(.functions.pct)%\nLines: \(.lines.pct)%"
          ' coverage/coverage-summary.json)

          # Decide status
          if [ "$EXIT_CODE" = "0" ]; then
            STATUS="✅ UnitTests passed"
          else
            STATUS="❌ UnitTests failed"
          fi

          # Write message to a file (avoids YAML parsing issues)
          {
            echo "# Automated Unit Testing"
            echo "## Project: $PROJECT_NAME"
            echo
            echo "### $STATUS on branch **$BRANCH**."
            echo
            echo "**Summary**"
            echo '```'
            echo "$SUMMARY"
            echo '```'
            echo
            echo "**Coverage**"
            echo '```'
            echo "$COVERAGE"
            echo '```'
            echo
            echo "**Test Details**"
            echo '```'
            echo "$DETAILS"
            echo '```'
          } > message.txt

          # Send to Discord using jq to build JSON
          jq -n --rawfile content message.txt '{content: $content}' \
            | curl -H "Content-Type: application/json" \
                  -X POST \
                  -d @- \
                  "$WEBHOOK_URL"
