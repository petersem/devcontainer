name: Run Jest and Notify (Discord)

on:
  push:

jobs:
  test-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests
        id: jest
        run: |
          set +e
          npm test -- --verbose > jest-output.txt 2>&1
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          set -e

      - name: Prepare Discord message
        id: format
        run: |
          # Escape backticks so Discord doesn't break the code block
          ESCAPED=$(sed 's/`/\\`/g' jest-output.txt)

          # Trim to avoid Discord 2000-char limit
          TRIMMED=$(echo "$ESCAPED" | head -c 1800)

          {
            echo "output<<EOF"
            echo "$TRIMMED"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Send Discord notification
        if: always()
        run: |
          STATUS="✅ Tests passed"
          if [ "${{ steps.jest.outputs.exit_code }}" != "0" ]; then
            STATUS="❌ Tests failed"
          fi

          CONTENT="${STATUS} on branch **${GITHUB_REF_NAME}**.\n\n\`\`\`\n${{ steps.format.outputs.output }}\n\`\`\`"

          curl -X POST \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"$CONTENT\"}" \
            "${{ secrets.WEBHOOK_URL }}"
