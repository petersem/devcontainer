name: Jest Test Details

on:
  push:
    branches:
      - 'main'

jobs:
  test-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests
        id: jest
        run: |
          set +e
          npm test -- --json --outputFile=jest-results.json
          EXIT_CODE=$?
          echo "EXIT_CODE=$EXIT_CODE" >> jest-exit-code.env
          set -e

      - name: Send discord notification
        if: always()
        env:
          SUMMARY: ${{ steps.parsed.outputs.summary }}
          DETAILS: ${{ steps.parsed.outputs.details }}
          EXIT_CODE: ${{ steps.jest.outputs.exit_code }}
          BRANCH: ${{ github.ref_name }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          # Determine pass/fail based on actual test results, not exit code
          FAILED_COUNT=$(jq '[.testResults[] | select(.status != "passed")] | length' jest-results.json)

          if [ "$FAILED_COUNT" -eq 0 ]; then
            STATUS="✅ UnitTests passed"
          else
            STATUS="❌ UnitTests failed"
          fi

          MESSAGE="${STATUS} on branch **${BRANCH}**.

**Summary**
\`\`\`
$SUMMARY
\`\`\`

**Details**
\`\`\`
$DETAILS
\`\`\`
"

          jq -n --arg content "$MESSAGE" '{content: $content}' \
            | curl -H "Content-Type: application/json" \
                  -X POST \
                  -d @- \
                  "$WEBHOOK_URL"
